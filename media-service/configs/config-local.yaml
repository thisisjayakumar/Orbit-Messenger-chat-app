server:
  http:
    addr: 0.0.0.0:8085
    timeout: 1s
  grpc:
    addr: 0.0.0.0:9095
    timeout: 1s

data:
  database:
    driver: postgres
    source: postgres://chat_user:chat_password@localhost:5432/chat_db?sslmode=disable
  redis:
    addr: localhost:6379
    read_timeout: 0.2s
    write_timeout: 0.2s

storage:
  minio:
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "chat-attachments"
    use_ssl: false

antivirus:
  enabled: false
